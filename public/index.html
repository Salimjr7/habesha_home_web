<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>EthioHome</title>
    <style>
      :root {
        --bg-color: #0b132b;
        --card-bg: #1c2541;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --text: #f8fafc;
        --text-muted: #94a3b8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .logo-container {
        margin-bottom: 24px;
        animation: pulse 2s infinite ease-in-out;
      }
      .logo {
        max-width: 180px;
        height: auto;
      }
      .title {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
      }
      .subtitle {
        font-size: 14px;
        color: var(--text-muted);
        max-width: 300px;
        line-height: 1.5;
        margin-bottom: 32px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
      .btn {
        background-color: var(--accent);
        color: #ffffff;
        border: none;
        padding: 12px 28px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      }
      .btn:hover {
        background-color: var(--accent-hover);
      }
      .btn:active {
        transform: scale(0.98);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.03);
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body>
    <div class="logo-container">
      <img src="ethiohome-logo.png" alt="EthioHome Logo" class="logo" />
    </div>
    <div class="spinner"></div>
    <h1 class="title">EthioHome</h1>
    <p class="subtitle" id="status-text">Connecting to EthioHome secure server...</p>
    <button class="btn" onclick="window.location.reload()">Reload App</button>

    <script>
      // Automatically attempt to reload if offline/disconnected
      window.addEventListener("online", () => {
        document.getElementById("status-text").innerText = "Connection restored! Loading...";
        window.location.reload();
      });
    </script>
  </body>
</html>
